defaults:
  - _self_
  - train: 14b_s5000_revalidation

experiment:
  exp_name: qwen3-14b-s5000-8gpu-baseline-wide
  seed: 42
  save_steps: 10000
  load: null
  exp_dir: outputs/s5000/qwen3_14b_baseline/baseline_wide_8gpu_cp1_20260716
  ckpt_format: torch
  task:
    type: train
    backend: megatron
    entrypoint: flagscale/train/train_gpt.py
  runner:
    backend: torchrun
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    nnodes: 1
    nproc_per_node: 8
    hostfile: null
  cmds:
    before_start: |
      ulimit -n 1048576
      if [ -n "$CONDA_SH" ]; then
        source "$CONDA_SH"
      else
        source "$HOME/anaconda3/etc/profile.d/conda.sh"
      fi
      if [ -n "$FLAGSCALE_TRAIN_ENV" ]; then
        conda activate "$FLAGSCALE_TRAIN_ENV"
      else
        conda activate s5000-autotune
      fi
      export WANDB_MODE=offline
  envs:
    LOGLEVEL: "INFO"
    MUSA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
    NCCL_ALGO: Ring
    MCCL_DEBUG: "WARN"
    FLAGSCALE_MUSA_COMPAT: "1"
    # Reduce fragmentation across many short-lived candidate subprocesses.
    PYTORCH_MUSA_ALLOC_CONF: "expandable_segments:True"
    OMP_NUM_THREADS: "4"
    WANDB_MODE: offline
  auto_tuner:
    algo:
      name: grid
      priority: null
      chip_aware_scoring: false
      use_profiled_time_cost: false
    space:
      data_parallel_size: auto
      use_distributed_optimizer: auto
      tensor_model_parallel_size: auto
      expert_model_parallel_size: [1]
      # Local torch RMSNorm currently rejects sequence parallelism.
      sequence_parallel: [false]
      pipeline_model_parallel_size: auto
      # Historical Qwen3-14B A800 runs had 56 VPP trials and zero successes.
      num_layers_per_virtual_pipeline_stage: [0]
      # Local DotProductAttention rejects CP>1 without Transformer Engine.
      context_parallel_size: [1]
      micro_batch_size: auto
      use_recompute: auto
      recompute_method: auto
      recompute_granularity: auto
      recompute_num_layers: auto
    control:
      run_best: false
      interval: 10
      max_time_per_task: 7200
      # Generator marks candidate jobs with --auto-tune. Legacy train.py then
      # skips the unconditional end-of-training checkpoint; save_interval is
      # also rewritten to 2000, safely above this three-iteration smoke.
      train_iters: 3
    memory_model:
      model_name: default
      gpu_memory: 81920
      gpu_utilization: [0.1, 1.0]

action: auto_tune

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
