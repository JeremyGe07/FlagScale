# Qwen3-14B workload used for the 8x MTT S5000 AutoTune baseline.
#
# Keep the model/data workload aligned with the historical 4xA800 baseline,
# while selecting the validated local-transformer MUSA path. Sequence
# parallelism is intentionally disabled in the search config because the
# current local RMSNorm fallback does not support it.
system:
  no_shared_fs: ${experiment.runner.no_shared_fs}
  num_workers: 0
  distributed_backend: nccl  # Translated to real MCCL by the opt-in MUSA adapter.
  tensor_model_parallel_size: 8
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  disable_bias_linear: true
  reset_position_ids: true
  reset_attention_mask: true
  qk_layernorm: true
  sequence_parallel: false
  use_distributed_optimizer: false
  overlap_grad_reduce: false
  overlap_param_gather: false
  finetune: false
  deterministic_mode: true
  precision:
    bf16: true
    attention_softmax_in_fp32: true
    accumulate_allreduce_grads_in_fp32: true
  logging:
    log_interval: 1
    tensorboard_log_interval: 1
    wandb_project: qwen3_14b_s5000_revalidation
    wandb_exp_name: ${experiment.exp_name}
    log_timers_to_tensorboard: true
    log_validation_ppl_to_tensorboard: true
    log_throughput: true
    log_params_norm: true
    log_num_zeros_in_grad: true
    log_memory_to_tensorboard: true
  checkpoint:
    save_interval: ${experiment.save_steps}
    load: ${experiment.load}
    ckpt_format: ${experiment.ckpt_format}

model:
  transformer_impl: local
  num_layers: 40
  hidden_size: 5120
  ffn_hidden_size: 17408
  kv_channels: 128
  group_query_attention: true
  num_attention_heads: 40
  num_query_groups: 8
  seq_length: 4096
  max_position_embeddings: 40960
  norm_epsilon: 1.0e-6
  use_rotary_position_embeddings: true
  rotary_base: 1000000
  swiglu: true
  normalization: RMSNorm
  init_method_std: 0.02
  attention_dropout: 0.0
  hidden_dropout: 0.0
  clip_grad: 1.0
  position_embedding_type: rope
  untie_embeddings_and_output_weights: true
  no_position_embedding: true
  no_rope_fusion: true
  no_masked_softmax_fusion: true
  no_bias_swiglu_fusion: true
  no_bias_dropout_fusion: true
  no_gradient_accumulation_fusion: true
  no_persist_layer_norm: true

  seed: ${experiment.seed}
  micro_batch_size: 1
  global_batch_size: 2048
  eval_iters: 0
  eval_interval: 1000
  train_samples: 244141056
  optimizer:
    weight_decay: 0.1
    adam_beta1: 0.9
    adam_beta2: 0.95
    lr_scheduler:
      lr: 3.0e-3
      min_lr: 3.0e-4
      lr_warmup_samples: 2048000
      lr_decay_style: WSD
      lr_wsd_decay_style: cosine
      lr_wsd_decay_iters: 1
      lr_wsd_decay_samples: 2048

data:
  data_path: ${oc.env:PILE_WIKIPEDIA_DEMO_PATH}
  split: "1"
  no_mmap_bin_files: true
  tokenizer:
    legacy_tokenizer: true
    tokenizer_type: QwenTokenizerFS
    tokenizer_path: ${oc.env:QWEN3_14B_PATH}
    vocab_size: 151851
    make_vocab_size_divisible_by: 64
