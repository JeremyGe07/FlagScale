# Small dense model for real S5000 training and AutoTune smoke tests.
system:
  no_shared_fs: ${experiment.runner.no_shared_fs}
  num_workers: 0
  distributed_backend: nccl  # Translated to real MCCL by the opt-in legacy adapter.
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  context_parallel_size: 1
  disable_bias_linear: true
  reset_position_ids: true
  reset_attention_mask: true
  qk_layernorm: true
  finetune: false
  deterministic_mode: true
  precision:
    bf16: true
    attention_softmax_in_fp32: true
    accumulate_allreduce_grads_in_fp32: true
  logging:
    log_interval: 1
    log_throughput: true
  checkpoint:
    save_interval: ${experiment.save_steps}
    load: ${experiment.load}
    ckpt_format: ${experiment.ckpt_format}

model:
  transformer_impl: local
  num_layers: 2
  hidden_size: 128
  ffn_hidden_size: 384
  kv_channels: 32
  num_attention_heads: 4
  group_query_attention: true
  num_query_groups: 2
  seq_length: 128
  max_position_embeddings: 128
  norm_epsilon: 1.0e-6
  use_rotary_position_embeddings: true
  rotary_base: 1000000
  swiglu: true
  normalization: RMSNorm
  init_method_std: 0.02
  attention_dropout: 0.0
  hidden_dropout: 0.0
  clip_grad: 1.0
  position_embedding_type: rope
  untie_embeddings_and_output_weights: false
  no_position_embedding: true
  no_rope_fusion: true
  no_masked_softmax_fusion: true
  no_bias_swiglu_fusion: true
  no_bias_dropout_fusion: true
  no_gradient_accumulation_fusion: true
  no_persist_layer_norm: true

  seed: ${experiment.seed}
  micro_batch_size: 1
  global_batch_size: 1
  eval_iters: 0
  eval_interval: 1000
  train_iters: 2
  optimizer:
    weight_decay: 0.01
    adam_beta1: 0.9
    adam_beta2: 0.95
    lr_scheduler:
      lr: 1.0e-4
      min_lr: 1.0e-5
      lr_warmup_iters: 0
      lr_decay_iters: 2
      lr_decay_style: cosine

data:
  data_path: ${oc.env:S5000_DATA_PREFIX}
  split: "1"
  no_mmap_bin_files: true
  tokenizer:
    legacy_tokenizer: true
    tokenizer_type: QwenTokenizerFS
    tokenizer_path: ${oc.env:S5000_TOKENIZER_PATH}
    vocab_size: 151936
    make_vocab_size_divisible_by: 64
